# Render blueprint. In the Render dashboard: New > Blueprint, point it at this
# repo, and it creates the web service.
#
# The database lives on Supabase rather than Render, because Render's free
# Postgres is deleted after 30 days and the demo went dark in September when
# that happened. Supabase free projects are not deleted, though they do pause
# after a week or so of no traffic.
services:
  - type: web
    name: custodia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Custodia
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Generate with `php artisan key:generate --show` and paste it in.
      # It has to keep the base64: prefix.
      - key: APP_KEY
        sync: false
      # Set this to https://<your-service>.onrender.com after the first deploy.
      - key: APP_URL
        sync: false
      # Sanctum's cookie auth fails silently if this doesn't match the host the
      # browser is actually on, so it's wired to the service's own hostname.
      - key: SANCTUM_STATEFUL_DOMAINS
        fromService:
          type: web
          name: custodia
          property: host
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # One connection string instead of five separate values. Laravel reads
      # DB_URL first and it overrides any DB_HOST/DB_DATABASE/etc.
      #
      # Copy this from Supabase: Connect > Session pooler. It has to be the
      # session pooler on port 5432, not the direct connection. Supabase's
      # direct connection is IPv6 only unless you pay for the IPv4 add-on, and
      # Render dials out over IPv4, so the direct string cannot resolve from
      # here. The transaction pooler on 6543 is no good either, because it
      # breaks the prepared statements PDO relies on.
      #
      # Looks like:
      #   postgresql://postgres.<project-ref>:<password>@aws-<region>.pooler.supabase.com:5432/postgres
      - key: DB_URL
        sync: false
